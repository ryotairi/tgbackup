# tgbackup configuration
# Docs: https://core.telegram.org/api/obtaining_api_id

telegram:
  api_id: 123456
  api_hash: "0123456789abcdef0123456789abcdef"
  # Destination chat/channel: numeric id ("-100..."), @username or invite link.
  channel: "-1001234567890"
  # Created by `tgbackup login` (chmod 600). Relative paths are from this file.
  session_file: ./session.txt
  # Set to true only for Telegram Premium accounts (allows parts up to 4 GiB).
  premium: false

# 32-byte master key (base64url, hex or passphrase). Generated by `tgbackup init`.
# Keep this file offline/backed up separately: without it restores are impossible.
master_key_file: ./master.key

# Caption prefix, useful to recognise parts in the chat.
prefix: tgbackup

# Encrypted bytes per Telegram document. Bigger = fewer messages, more memory
# and more to re-upload on failure. 2 GiB max for regular accounts.
part_size: 268435456

# Parallel MTProto workers used to upload one part (1..16; GramJS is unstable
# above 16). Parts themselves are still uploaded sequentially.
upload_workers: 8

# Pack the whole archive to tmp_dir before uploading anything. Costs archive-
# sized disk space there, but shows the exact part count upfront and captions
# get the total ("[2/7]"). Set to false to pack and upload in one pass.
stage_archive: true

# zstd level (1..22). 10 is a good speed/size trade-off for backups.
zstd_level: 10

# Random delay inserted between part uploads (seconds), inclusive range.
upload_delay:
  min: 2
  max: 10

# Give up opening the MTProto connection after this many seconds. Direct
# connections to Telegram can black-hole for minutes on censored networks.
connect_timeout: 60

# Restore watchdog: if a part download receives no data for this many seconds,
# the frozen connection is killed and the part retries from scratch.
# 0 disables the watchdog. Increase for very slow proxies.
download_stall_timeout: 300

# Scratch space for encrypted parts (created with mode 0700).
tmp_dir: ./tmp

# Outbound SOCKS proxy for all Telegram connections. Delete this block to
# connect directly. `type` is socks5 or socks4.
proxy:
  enabled: false
  type: socks5
  host: 127.0.0.1
  port: 1080
  username: ""
  password: ""
  # timeout: 30                   # seconds, GramJS proxy connection timeout
  # Alternatively: url: "socks5://user:pass@127.0.0.1:1080"
